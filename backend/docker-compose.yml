name: nmk-backend

services:
  app:
    build: .
    init: true
    ports:
      - "${APP_PORT:-3000}:${APP_PORT:-3000}"
      - "${STUDIO_PORT:-5555}:${STUDIO_PORT:-5555}"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Assembled here rather than declared in .env, for the same reason
      # DATABASE_URL is: it is a fact about this Compose network, not a
      # preference. That also means it can never go missing from a developer's
      # .env, which `getOrThrow` would otherwise turn into a boot failure.
      KAFKA_BROKERS: kafka:9092
    volumes:
      - ./:/app
      - /app/node_modules
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:${APP_PORT:-3000}/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # One worker per dispatch lane. Three containers rather than one process
  # consuming three topics, because separate containers are what the isolation
  # actually *is*: the express lane has its own CPU, its own connection pool and
  # its own event loop, so a bulk backlog cannot make it wait. Scaling a lane is
  # `docker compose up -d --scale worker-bulk=4`, and the other two are
  # unaffected.
  #
  # **They wait for `app` to be healthy, and that is a build dependency rather
  # than a runtime one.** `dist/` lives on the bind mount every container in this
  # stack shares, and `app`'s `nest start --watch` is what compiles it — including
  # `worker.js`. Workers therefore run the already-compiled output instead of
  # each running their own `nest start`, which would have four processes wiping
  # and rewriting one `dist/` (and, with a private volume per worker, would fail
  # outright: `deleteOutDir` cannot rmdir a mount point). A production image would
  # bake `npm run build` in and drop this edge; here the bind mount is the whole
  # point of the dev stack, so the app is the compiler.
  #
  # **`restart: unless-stopped` on all three, and it is not boilerplate.** A
  # worker fails its boot deliberately when it cannot declare or reach its lane
  # topic, and without a restart policy that verdict is permanent: the container
  # stays dead, `docker compose up --wait` still reports it healthy (a service
  # with no healthcheck counts as ready the moment it is running), and the lane
  # is silently unconsumed until somebody thinks to look. Restarting is what
  # turns "the broker was not ready yet" from an outage into a retry.
  worker-express:
    build: .
    init: true
    restart: unless-stopped
    command: npm run start:worker
    env_file:
      - .env
    environment:
      WORKER_LANE: EXPRESS
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Assembled here rather than declared in .env, for the same reason
      # DATABASE_URL is: it is a fact about this Compose network, not a
      # preference. That also means it can never go missing from a developer's
      # .env, which `getOrThrow` would otherwise turn into a boot failure.
      KAFKA_BROKERS: kafka:9092
    volumes:
      - ./:/app
      - /app/node_modules
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  worker-bulk:
    build: .
    init: true
    restart: unless-stopped
    command: npm run start:worker
    env_file:
      - .env
    environment:
      WORKER_LANE: BULK
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Assembled here rather than declared in .env, for the same reason
      # DATABASE_URL is: it is a fact about this Compose network, not a
      # preference. That also means it can never go missing from a developer's
      # .env, which `getOrThrow` would otherwise turn into a boot failure.
      KAFKA_BROKERS: kafka:9092
    volumes:
      - ./:/app
      - /app/node_modules
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  worker-shared:
    build: .
    init: true
    restart: unless-stopped
    command: npm run start:worker
    env_file:
      - .env
    environment:
      WORKER_LANE: SHARED
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Assembled here rather than declared in .env, for the same reason
      # DATABASE_URL is: it is a fact about this Compose network, not a
      # preference. That also means it can never go missing from a developer's
      # .env, which `getOrThrow` would otherwise turn into a boot failure.
      KAFKA_BROKERS: kafka:9092
    volumes:
      - ./:/app
      - /app/node_modules
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # Single-node KRaft — no Zookeeper, which Kafka 4 removed entirely.
  #
  # Two listeners, for two different callers. PLAINTEXT advertises `kafka:9092`
  # and is what the app and the workers use over the Compose network. EXTERNAL
  # advertises `localhost:${KAFKA_PORT}` and exists only so a human can point a
  # tool at the broker from the host; it is parameterised because both stacks
  # run their own broker and would otherwise fight over one port.
  kafka:
    image: apache/kafka:4.0.0
    ports:
      - "${KAFKA_PORT:-9092}:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # One broker means one replica of everything. These three default to 3 and
      # would leave the internal topics permanently under-replicated here.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Defaults to 3s, which every consumer group pays on first join. With four
      # processes starting at once that is three seconds added to every cold
      # start, and there is no rebalance storm to smooth out on one node.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # The topics the app declares at boot are the only ones that should exist;
      # a typo'd topic name should fail loudly, not conjure a new topic.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD",
          "/opt/kafka/bin/kafka-topics.sh",
          "--bootstrap-server",
          "localhost:9092",
          "--list",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  kafkadata:
